<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Beat Sync Monitor 0.2</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../../../shared/metronome/metronome-panel.css" />
</head>
<body>
  <main class="app">
    <canvas id="stage" aria-label="Beat sync monitor visualization"></canvas>

    <div class="data-popover" id="dataPopover" role="status" aria-live="polite" hidden>
      <div class="data-popover-label" id="dataPopoverLabel"></div>
      <div class="data-popover-value" id="dataPopoverValue"></div>
      <div class="data-popover-desc" id="dataPopoverDesc"></div>
    </div>

    <section class="hud" aria-label="Beat Sync Monitor controls">
      <div class="identity">
        <span class="version">v0.2 Camera Sync</span>
      </div>

      <div class="hud-section">
        <span class="section-label">Camera</span>
        <div class="camera-controls">
          <button id="cameraToggleButton" type="button">Camera On</button>
          <select id="cameraSelect" aria-label="Camera source">
            <option value="">Default camera</option>
          </select>
        </div>
        <label>
          <span>Scale</span>
          <input id="videoScaleInput" type="range" min="24" max="100" value="50" />
          <output id="videoScaleValue">50%</output>
        </label>
        <label>
          <span>Shade</span>
          <input id="videoShadeInput" type="range" min="0" max="90" value="20" />
          <output id="videoShadeValue">20%</output>
        </label>
        <span id="cameraStatus" class="camera-status">Camera off</span>
      </div>
    </section>

    <aside class="rhythm-panel" data-metronome-panel data-bpm="120" data-bpm-max="220" data-volume="55" data-meters="odd" data-offbeat="true" aria-label="Beat controls"></aside>
  </main>

  <script src="../../../shared/metronome/metronome-panel.js"></script>
  <script src="../../../shared/metronome/metronome.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
