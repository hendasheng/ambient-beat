<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beat Sync Monitor 0.1</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="../../../shared/metronome/metronome-panel.css" />
</head>
<body>
  <main class="app">
    <canvas id="stage" aria-label="Beat sync monitor visualization"></canvas>

    <div class="data-popover" id="dataPopover" role="status" aria-live="polite" hidden>
      <div class="data-popover-label" id="dataPopoverLabel"></div>
      <div class="data-popover-value" id="dataPopoverValue"></div>
      <div class="data-popover-desc" id="dataPopoverDesc"></div>
    </div>

    <aside class="rhythm-panel" aria-label="Beat controls">
      <div class="rhythm-primary">
        <div class="control-group timing-group">
          <span class="group-label">Tempo</span>
          <div class="control-grid">
            <label for="bpmInput">
              <span class="label">BPM</span>
              <input id="bpmInput" type="number" min="40" max="220" step="1" value="120" inputmode="numeric" />
            </label>
            <label for="meterSelect">
              <span class="label">Meter</span>
              <select id="meterSelect">
                <option value="3/4">3/4</option>
                <option value="4/4" selected>4/4</option>
                <option value="5/4">5/4</option>
                <option value="7/4">7/4</option>
              </select>
            </label>
          </div>
        </div>

        <div class="control-group feel-group">
          <span class="group-label">Rally Feel</span>
          <div class="control-grid">
            <label for="subdivisionSelect">
              <span class="label">Rhythm</span>
              <select id="subdivisionSelect">
                <option value="auto" selected>Auto</option>
                <option value="eighth">1/8</option>
                <option value="triplet">1/8T</option>
                <option value="sixteenth">1/16</option>
              </select>
            </label>
            <label for="countInSelect">
              <span class="label">Count In</span>
              <select id="countInSelect">
                <option value="0" selected>None</option>
                <option value="1">1 bar</option>
                <option value="2">2 bars</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="control-group beat-group">
        <span class="group-label">Beat</span>
        <div class="beat-strip" id="beatStrip" aria-hidden="true"></div>
        <div class="rhythm-readout">
          <strong id="tempoLabel">120 BPM</strong>
          <span id="meterLabel">4/4 · beat 1 · bar 001</span>
        </div>
      </div>

      <div class="transport-bar">
        <label for="offbeatInput" class="offbeat-control">
          <span class="label">Offbeat</span>
          <input id="offbeatInput" type="checkbox" />
        </label>
        <label for="clickVolumeInput" class="volume-control">
          <span class="label">Click</span>
          <input id="clickVolumeInput" type="range" min="0" max="100" step="1" value="55" />
          <span class="volume-value" id="clickVolumeLabel">55%</span>
        </label>
        <div class="transport-controls">
          <button id="playPauseButton" type="button">Start</button>
          <button id="resetButton" type="button">Reset</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="../../../shared/metronome/metronome.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
