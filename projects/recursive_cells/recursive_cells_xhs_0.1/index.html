<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>氛围节拍-递归细胞</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./metronome-panel.css" />
</head>
<body>
  <main class="app" aria-label="氛围节拍-递归细胞">
    <canvas id="stage"></canvas>

    <section class="hud" aria-label="氛围节拍-递归细胞控制">
      <div class="identity">
        <span class="tool-name">氛围节拍-递归细胞</span>
      </div>

      <div class="readout">
        <span id="cellCount">0 个单元</span>
        <span id="fpsReadout">-- FPS</span>
      </div>

      <div class="hud-section">
        <span class="section-label">结构</span>
        <label>
          <span>点数</span>
          <input id="pointInput" type="range" min="60" max="560" value="240" step="10" />
          <output id="pointValue">240</output>
        </label>

        <label>
          <span>最小尺寸</span>
          <input id="minSizeInput" type="range" min="10" max="90" value="34" />
          <output id="minSizeValue">34</output>
        </label>

        <label>
          <span>不规则度</span>
          <input id="irregularityInput" type="range" min="0" max="100" value="62" />
          <output id="irregularityValue">0.62</output>
        </label>

        <button id="resetButton" class="secondary-button" type="button">更换种子</button>
      </div>

      <div class="hud-section">
        <span class="section-label">预览</span>
        <label>
          <span>运动</span>
          <input id="motionInput" type="range" min="0" max="100" value="45" />
          <output id="motionValue">0.45</output>
        </label>

        <label>
          <span>速度</span>
          <input id="speedInput" type="range" min="0" max="120" value="20" />
          <output id="speedValue">0.20</output>
        </label>
      </div>

      <div class="hud-section">
        <span class="section-label">摄像头</span>
        <div class="camera-controls">
          <button id="cameraToggleButton" type="button">开启摄像头</button>
          <button id="cameraFacingButton" class="secondary-button" type="button">切到后置</button>
        </div>
        <span id="cameraStatus" class="camera-status">摄像头已关闭</span>
        <div class="camera-actions">
          <button id="saveImageButton" type="button">保存画面</button>
          <button id="postNoteButton" type="button">发布笔记</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside class="rhythm-panel" aria-label="节拍控制">
      <div class="rhythm-primary">
        <div class="control-group">
          <span class="group-label">速度</span>
          <div class="control-grid">
            <label for="bpmInput">
              <span class="label">速度</span>
              <input id="bpmInput" type="number" min="40" max="240" step="1" value="92" inputmode="numeric" />
            </label>
            <label for="meterSelect">
              <span class="label">拍号</span>
              <select id="meterSelect">
                <option value="3/4">3/4</option>
                <option value="4/4" selected>4/4</option>
                <option value="5/4">5/4</option>
                <option value="7/4">7/4</option>
              </select>
            </label>
          </div>
        </div>

        <div class="control-group">
          <span class="group-label">节奏</span>
          <div class="control-grid">
            <label for="subdivisionSelect">
              <span class="label">细分</span>
              <select id="subdivisionSelect">
                <option value="auto" selected>自动</option>
                <option value="eighth">1/8</option>
                <option value="triplet">1/8T</option>
                <option value="sixteenth">1/16</option>
              </select>
            </label>
            <label for="countInSelect">
              <span class="label">预备拍</span>
              <select id="countInSelect">
                <option value="0" selected>无</option>
                <option value="1">1 小节</option>
                <option value="2">2 小节</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="control-group beat-group">
        <span class="group-label">节拍</span>
        <div class="beat-strip" id="beatStrip" aria-hidden="true"></div>
        <div class="rhythm-readout">
          <strong id="tempoLabel">92 拍/分</strong>
          <span id="meterLabel">4/4 · 自动 · 第 1 拍 · 第 001 小节</span>
        </div>
      </div>

      <div class="transport-bar">
        <label for="offbeatInput" class="offbeat-control">
          <span class="label">反拍</span>
          <input id="offbeatInput" type="checkbox" />
        </label>
        <label for="clickVolumeInput" class="volume-control">
          <span class="label">音量</span>
          <input id="clickVolumeInput" type="range" min="0" max="100" step="1" value="45" />
          <span class="volume-value" id="clickVolumeLabel">45%</span>
        </label>
        <div class="transport-controls">
          <button id="playPauseButton" type="button">开始</button>
          <button id="rhythmResetButton" class="icon-button" type="button" aria-label="重置" title="重置">
            <img src="./refresh-01.svg" alt="" aria-hidden="true" />
          </button>
        </div>
      </div>
    </aside>
  </main>

  <script src="./metronome.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
