<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Recursive Cells v0.3</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../../shared/metronome/metronome-panel.css" />
</head>
<body>
  <main class="app" aria-label="Recursive Cells v0.3">
    <canvas id="stage"></canvas>

    <section class="hud" aria-label="Recursive Cells controls">
      <div class="identity">
        <a class="back-link" href="../index.html">Recursive Cells</a>
        <span class="version">v0.3 Signal Cells</span>
      </div>

      <div class="readout">
        <span id="cellCount">0 cells</span>
        <span id="fpsReadout">-- fps</span>
      </div>

      <div class="hud-section">
        <span class="section-label">Structure</span>
        <label>
          <span>Points</span>
          <input id="pointInput" type="range" min="60" max="560" value="240" step="10" />
          <output id="pointValue">240</output>
        </label>

        <label>
          <span>Min Size</span>
          <input id="minSizeInput" type="range" min="10" max="90" value="34" />
          <output id="minSizeValue">34</output>
        </label>

        <label>
          <span>Irregularity</span>
          <input id="irregularityInput" type="range" min="0" max="100" value="62" />
          <output id="irregularityValue">0.62</output>
        </label>

        <button id="resetButton" class="secondary-button" type="button">Reset Seed</button>
      </div>

      <div class="hud-section">
        <span class="section-label">Preview</span>
        <label>
          <span>Motion</span>
          <input id="motionInput" type="range" min="0" max="100" value="45" />
          <output id="motionValue">0.45</output>
        </label>

        <label>
          <span>Speed</span>
          <input id="speedInput" type="range" min="0" max="120" value="20" />
          <output id="speedValue">0.20</output>
        </label>
      </div>

      <div class="hud-section">
        <span class="section-label">Camera</span>
        <div class="camera-controls">
          <button id="cameraToggleButton" type="button">Camera On</button>
          <select id="cameraSelect" aria-label="Camera source">
            <option value="">Default camera</option>
          </select>
        </div>
        <span id="cameraStatus" class="camera-status">Camera off</span>
      </div>
    </section>

    <aside class="rhythm-panel" data-metronome-panel data-bpm="92" data-volume="45" data-meters="odd" data-rhythm-label="Motion" data-offbeat="true" aria-label="Beat controls"></aside>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="../../../shared/metronome/metronome-panel.js"></script>
  <script src="../../../shared/metronome/metronome.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
