<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recursive Cells v0.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-label="Recursive Cells v0.1">
    <canvas id="stage"></canvas>

    <section class="hud" aria-label="Recursive Cells controls">
      <div class="identity">
        <a class="back-link" href="../index.html">Recursive Cells</a>
        <span class="version">v0.1 Dynamic Cut</span>
      </div>

      <div class="readout">
        <span id="cellCount">0 cells</span>
        <span id="fpsReadout">-- fps</span>
      </div>

      <label>
        <span>Points</span>
        <input id="pointInput" type="range" min="60" max="560" value="240" step="10" />
        <output id="pointValue">240</output>
      </label>

      <label>
        <span>Min Size</span>
        <input id="minSizeInput" type="range" min="10" max="90" value="34" />
        <output id="minSizeValue">34</output>
      </label>

      <label>
        <span>Motion</span>
        <input id="motionInput" type="range" min="0" max="100" value="58" />
        <output id="motionValue">0.58</output>
      </label>

      <label>
        <span>Irregularity</span>
        <input id="irregularityInput" type="range" min="0" max="100" value="62" />
        <output id="irregularityValue">0.62</output>
      </label>

      <label>
        <span>Speed</span>
        <input id="speedInput" type="range" min="0" max="120" value="48" />
        <output id="speedValue">0.48</output>
      </label>

      <button id="resetButton" type="button">Reset Seed</button>
    </section>
  </main>

  <script src="sketch.js"></script>
</body>
</html>
