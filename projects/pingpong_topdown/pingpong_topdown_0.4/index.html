<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>PingPong Topdown v0.4</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../../shared/metronome/metronome-panel.css" />
</head>
<body>
  <main class="stage" aria-label="PingPong Topdown v0.4">
    <canvas id="rallyCanvas"></canvas>

    <aside class="rhythm-panel" data-metronome-panel data-bpm="68" data-volume="78" data-meters="simple" data-feel-label="Rally Feel" data-readout="4/4 · hit 1, table 1.5" aria-label="Metronome controls"></aside>

    <div class="mini-beat" aria-hidden="true">
      <div class="mini-beat-strip" id="miniBeatStrip"></div>
      <div class="mini-beat-readout" id="miniBeatReadout">68 BPM · 4/4</div>
    </div>

  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="../../../shared/metronome/metronome-panel.js"></script>
  <script src="../../../shared/metronome/metronome.js"></script>
  <script src="sketch.js"></script>

</html>
